# =============================================================================
#  Nginx Reverse Proxy Configuration
#  Routes: /api/** and /ws/** → backend:8080
#          all else            → frontend:80
# =============================================================================

upstream backend {
    server backend:8080;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost slotsync.io www.slotsync.io;

    # ── Logging ─────────────────────────────────────────────────────────────
    access_log  /var/log/nginx/access.log combined;
    error_log   /var/log/nginx/error.log warn;

    # ── Client limits ────────────────────────────────────────────────────────
    client_max_body_size 10m;

    # ── Proxy timeouts ───────────────────────────────────────────────────────
    proxy_connect_timeout       60s;
    proxy_send_timeout          60s;
    proxy_read_timeout          60s;

    # ── Common proxy headers ─────────────────────────────────────────────────
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    # ── WebSocket upgrade headers ────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # ── API Routes → Spring Boot ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        add_header X-Served-By "slotsync-backend";
    }

    # ── WebSocket / STOMP → Spring Boot ─────────────────────────────────────
    location /ws/ {
        proxy_pass http://backend;
        proxy_read_timeout 3600s;   # Long-lived WebSocket connections
        proxy_send_timeout 3600s;
    }

    # ── OpenAPI / Swagger → Spring Boot ─────────────────────────────────────
    location /api-docs {
        proxy_pass http://backend;
    }
    location /swagger-ui/ {
        proxy_pass http://backend;
    }

    # ── Actuator → Spring Boot (restricted) ─────────────────────────────────
    location /actuator/ {
        proxy_pass http://backend;
        # In production, restrict this to internal networks only
        # allow 10.0.0.0/8;
        # deny all;
    }

    # ── Frontend SPA ─────────────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend;
    }

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        font/truetype font/opentype image/svg+xml;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options         "DENY";
    add_header X-Content-Type-Options  "nosniff";
    add_header X-XSS-Protection        "1; mode=block";
    add_header Referrer-Policy         "strict-origin-when-cross-origin";
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()";
}

# Connection upgrade map for WebSocket
map $http_upgrade $connection_upgrade {
    default  upgrade;
    ''       close;
}
