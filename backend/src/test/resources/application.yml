spring:
  datasource:
    url: jdbc:h2:mem:slotsync_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

slotsync:
  jwt:
    secret: test-secret-key-that-is-at-least-32-characters-long-for-hmac-sha256
    access-token-expiry-ms: 60000
    refresh-token-expiry-ms: 120000
  cors:
    allowed-origins: http://localhost:5173
  notifications:
    email:
      enabled: false

spring.mail.host: localhost
spring.mail.port: 25
