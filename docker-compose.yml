version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: slotsync-mysql
    restart: always
    environment:
      MYSQL_DATABASE: slotsync_dev
      MYSQL_USER: slotsync
      MYSQL_PASSWORD: slotsync_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: slotsync-backend
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=slotsync_dev
      - DB_USERNAME=slotsync
      - DB_PASSWORD=slotsync_password
      - JWT_SECRET=test-secret-key-that-is-at-least-32-characters-long-for-hmac-sha256
      - EMAIL_ENABLED=false
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: slotsync-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
